# Alternativa con Serverless Framework.
# Deploy:  mvn package && serverless deploy
service: akka-serverless-actors
provider:
  name: aws
  runtime: java11
  region: us-east-1
  memorySize: 512
  timeout: 30
package:
  artifact: target/akka-serverless-actors.jar
functions:
  task:
    handler: com.example.lambda.TaskHandler::handleRequest
    events:
      - http:
          path: task
          method: post
